<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Ticker</title>
  <style>
@font-face{font-family:'DRPublik-Bold';src:url('fonts/DRPublik-Bold.otf') format('opentype');}
@font-face{font-family:'DRPublik-CondensedBold';src:url('fonts/DRPublik-CondensedBold.otf') format('opentype');}

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

    #bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 56px;
      background: #0D1B3E;
      transform: translateY(100%);
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    #track-outer {
      overflow: hidden;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      -webkit-mask-image: linear-gradient(to right, black 88%, transparent 100%);
      mask-image: linear-gradient(to right, black 88%, transparent 100%);
    }

    #track {
      display: flex;
      white-space: nowrap;
      align-items: center;
      font-family: 'DRPublik-Bold', 'Segoe UI', Arial, sans-serif;
      font-size: 24px;
      color: #fff;
      padding-left: 40px;
      line-height: 56px;
      will-change: transform;
      transform: translateZ(0);
    }

    .t-ov { font-weight: bold; margin-right: 12px; }
    .t-sep { opacity: 0.4; margin: 0 18px; }

    @keyframes ticker-scroll {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }
  </style>
</head>
<body>
  <div id="bar">
    <div id="track-outer">
      <div id="track"></div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script>
    const params    = new URLSearchParams(window.location.search);
    const pid       = params.get('p') || '';
    const isPreview = params.has('preview');
    const pf        = pid ? '&projekt_id=eq.' + encodeURIComponent(pid) : '';

    let visible     = false;
    let pendingHTML = null;
    let fetchTimer  = null;

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function fetchTickerItems() {
      const rows = await fetch(
        SB_URL + '/rest/v1/tickers?on_air=eq.true&breaking=eq.false&select=overskrift,tekst&order=slot.asc' + pf,
        { headers: SB_HDR }
      ).then(r => r.json());
      return rows.filter(r => r.overskrift || r.tekst).map(r =>
        r.overskrift
          ? '<span class="t-ov">' + esc(r.overskrift.toUpperCase()) + '</span>' + esc(r.tekst || '')
          : esc(r.tekst || '')
      );
    }

    function buildTrackHTML(items) {
      const sep = '<span class="t-sep">&nbsp;&bull;&nbsp;</span>';
      const one = items.join(sep) + sep;
      return one + one;
    }

    function applyHTML(track, html) {
      // Stop animation, swap content, restart — all in one rAF batch to avoid reflow stutter
      track.style.animation = 'none';
      track.innerHTML = html;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const dur = (track.scrollWidth / 2) / 120;
          track.style.animation = 'ticker-scroll ' + dur + 's linear infinite';
        });
      });
    }

    function startFetchLoop() {
      // Fetch fresh data every 15s and queue it for the next loop boundary
      fetchTimer = setInterval(async () => {
        if (!visible) return;
        try {
          const items = await fetchTickerItems();
          if (items.length) pendingHTML = buildTrackHTML(items);
        } catch (_) {}
      }, 15000);
    }

    function stopFetchLoop() {
      clearInterval(fetchTimer);
      fetchTimer = null;
      pendingHTML = null;
    }

    function attachIterationHandler(track) {
      track.addEventListener('animationiteration', function onIter() {
        if (!visible) { track.removeEventListener('animationiteration', onIter); return; }
        if (pendingHTML && pendingHTML !== track.innerHTML) {
          const html = pendingHTML;
          pendingHTML = null;
          // Swap at the loop boundary using double-rAF to stay on compositor thread
          track.style.animation = 'none';
          track.innerHTML = html;
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (!visible) return;
              const dur = (track.scrollWidth / 2) / 120;
              track.style.animation = 'ticker-scroll ' + dur + 's linear infinite';
            });
          });
        }
      });
    }

    async function runIN() {
      visible = true;
      try {
        const items = isPreview
          ? [
              '<span class="t-ov">FODBOLD</span>Lyngby er tilbage i Superligaen',
              '<span class="t-ov">SPORT</span>Holger Rune vinder Copenhagen Open',
              'Danmark vinder 3-1 over Sverige i Nations League'
            ]
          : await fetchTickerItems();

        if (!items.length) { visible = false; setTimeout(pollTrigger, 2000); return; }

        const track = document.getElementById('track');
        const bar   = document.getElementById('bar');

        track.innerHTML = buildTrackHTML(items);
        attachIterationHandler(track);
        startFetchLoop();

        bar.style.transition = 'transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        bar.style.transform  = 'translateY(0)';

        // Start scroll after bar finishes sliding in
        setTimeout(() => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              const dur = (track.scrollWidth / 2) / 120;
              track.style.animation = 'ticker-scroll ' + dur + 's linear infinite';
            });
          });
        }, 500);
      } catch (_) { visible = false; }
      setTimeout(pollTrigger, 2000);
    }

    function runOUT() {
      visible = false;
      stopFetchLoop();
      const track = document.getElementById('track');
      const bar   = document.getElementById('bar');
      track.style.animation = 'none';
      bar.style.transition  = 'transform 0.4s cubic-bezier(0.55, 0, 1, 0.45)';
      bar.style.transform   = 'translateY(100%)';
      setTimeout(pollTrigger, 2000);
    }

    async function pollTrigger() {
      if (isPreview) return;
      try {
        const rows = await fetch(
          SB_URL + '/rest/v1/settings?key=eq.ticker_ovl_trigger&select=value' + pf,
          { headers: SB_HDR }
        ).then(r => r.json());
        const trigger = rows[0]?.value;
        if (trigger === 'in'  && !visible) { runIN();  return; }
        if (trigger === 'out' &&  visible) { runOUT(); return; }
      } catch (_) {}
      setTimeout(pollTrigger, 2000);
    }

    if (isPreview) { runIN(); } else { pollTrigger(); }
  </script>
</body>
</html>
