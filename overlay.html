<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="lower-third-frame" allowtransparency="true" src=""></iframe>
  <iframe id="live-boks-frame"   allowtransparency="true" src=""></iframe>
  <iframe id="breaking-frame"    allowtransparency="true" src=""></iframe>
  <iframe id="ticker-frame"         allowtransparency="true" src=""></iframe>
  <iframe id="ticker-breaking-frame" allowtransparency="true" src=""></iframe>
  <iframe id="score-frame"          allowtransparency="true" src=""></iframe>
  <iframe id="score-breaking-frame"  allowtransparency="true" src=""></iframe>
  <iframe id="overlay-3-frame"   allowtransparency="true" src=""></iframe>
  <iframe id="credits-frame"     allowtransparency="true" src=""></iframe>

  <script>
    const SB_URL  = 'https://rxzxdcweqpbnvfkpnnrn.supabase.co';
    const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4enhkY3dlcXBibnZma3BubnJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMzYzMTUsImV4cCI6MjA5MDgxMjMxNX0.e6DtMVskOwcMyJBFJDIEYsSZC0HAcD7AhNcg5PvlArU';
    const SB_HDR  = { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON };
    const customFrameMap = {};
    const customState    = {};
    const customStateTime = {};

    // Grafik-definitioner: id matcher iframe-id og Supabase-nøglen i overlay_lag_order
    const GRAPHICS = [
      { id: 'lower-third', file: 'lower-third.html'    },
      { id: 'live-boks',   file: 'Graphics/LIve_bokse/Live_BOKS_gsap.html' },
      { id: 'breaking',    file: 'breaking.html'        },
      { id: 'ticker',          file: 'Graphics/Ticker/Ticker_gsap.html'  },
      { id: 'ticker-breaking', file: 'Graphics/Ticker/Ticker_breaking_gsap.html' },
      { id: 'score',           file: 'Graphics/Stillings_boks/Stillings_boks_uden_live_boks_gsap.html' },
      { id: 'score-breaking',  file: 'Graphics/Stillings_boks/Stillings_boks_BREAKING_MASTER.html' },
      { id: 'overlay-3',   file: 'OverLay_3.html'        },
      { id: 'credits',     file: 'credits.html'         },
    ];
    const DEFAULT_ORDER = GRAPHICS.map(g => g.id); // top→bund
    const DEFAULT_TICKER_SUB_ORDER = ['live-boks', 'breaking', 'ticker-breaking', 'score-breaking', 'ticker', 'score'];
    let tickerSubOrder = [...DEFAULT_TICKER_SUB_ORDER];

    const params  = new URLSearchParams(window.location.search);
    const pid     = params.get('p') || '';
    const pf      = pid ? '&projekt_id=eq.' + encodeURIComponent(pid) : '';
    const preview = params.get('preview') || '';

    // Sæt iframe-sources (preview overstyre normale sources)
    const originalSrcs = {};
    GRAPHICS.forEach(g => {
      const frame = document.getElementById(g.id + '-frame');
      if (!frame) return;
      let src = g.file + '?p=' + pid;
      if (preview === 'credits'             && g.id === 'credits')    src = g.file + '?preview=1&p=' + pid;
      if ((preview === 'home' || preview === 'away') && g.id === 'overlay-3') src = g.file + '?preview=' + preview + '&p=' + pid;
      originalSrcs[g.id] = src;
      frame.src = src;
    });

    function applyOrder(mainOrder) {
      const total = mainOrder.length;
      mainOrder.forEach((id, idx) => {
        const baseZ = (total - idx) * 1000;
        if (id === 'ticker') {
          // Byg komplet sub-liste: bruger-rækkefølge + DEFAULT-items der ikke er med
          // (sikrer at ticker-breaking / score-breaking aldrig beholder et gammelt z-index)
          const allSubs = [...tickerSubOrder];
          DEFAULT_TICKER_SUB_ORDER.forEach(s => { if (!allSubs.includes(s)) allSubs.push(s); });
          allSubs.forEach((subId, subIdx) => {
            const frame = document.getElementById(subId + '-frame');
            if (frame) frame.style.zIndex = baseZ - subIdx * 10;
          });
        } else if (!tickerSubOrder.includes(id) && !DEFAULT_TICKER_SUB_ORDER.includes(id)) {
          // Sæt kun z-index for items der hverken er i den aktive eller den default ticker-sub-liste
          const frame = document.getElementById(id + '-frame');
          if (frame) frame.style.zIndex = baseZ;
        }
      });
    }

    async function pollLagOrder() {
      try {
        const fetches = [
          fetch(`${SB_URL}/rest/v1/settings?key=eq.overlay_lag_order&select=value${pf}`, { headers: SB_HDR }).then(r => r.json()),
          fetch(`${SB_URL}/rest/v1/settings?key=eq.ticker_lag_order&select=value${pf}`,  { headers: SB_HDR }).then(r => r.json()),
          pf ? fetch(`${SB_URL}/rest/v1/settings?key=eq.grafik_overlay_map&select=value${pf}`, { headers: SB_HDR }).then(r => r.json()) : Promise.resolve([]),
        ];
        const [mainRows, subRows, mapRows] = await Promise.all(fetches);
        const rawMain = mainRows[0]?.value || '';
        const rawSub  = subRows[0]?.value  || '';
        let mainOrder = rawMain ? rawMain.split(',').map(s => s.trim()).filter(Boolean) : DEFAULT_ORDER;
        tickerSubOrder  = rawSub  ? rawSub.split(',').map(s => s.trim()).filter(Boolean)  : DEFAULT_TICKER_SUB_ORDER;
        if (!mainOrder.includes('ticker')) mainOrder = [...mainOrder, 'ticker'];
        applyOrder(mainOrder);
        // Respekter overlay_target: sæt 'komm'-tildelte iframes til about:blank
        const grafMap = (mapRows[0]?.value) ? JSON.parse(mapRows[0].value) : {};
        GRAPHICS.forEach(g => {
          const frame = document.getElementById(g.id + '-frame');
          if (!frame) return;
          const target = grafMap[g.id] || 'hoved';
          if (target !== 'hoved') {
            if (frame.src !== 'about:blank') frame.src = 'about:blank';
          } else {
            const expected = originalSrcs[g.id];
            if (expected && frame.src === 'about:blank') frame.src = expected;
          }
        });
      } catch {}
      setTimeout(pollLagOrder, 3000);
    }

    // Opret broadcast-kanal med det samme — IKKE inde i loadCustomGrafik,
    // så den er subscribed før custom grafik-frames er loadet.
    if (pid) {
      const _sbBc = window.supabase.createClient(SB_URL, SB_ANON);
      _sbBc.channel('triggers-' + pid)
        .on('broadcast', { event: 'trigger' }, function(msg) {
          const p = msg.payload;
          if (!p || p.projekt_id !== pid) return;
          if (p.key === 'lt_trigger') {
            try {
              var ltFrame = document.getElementById('lower-third-frame');
              if (ltFrame && ltFrame.contentWindow) {
                ltFrame.contentWindow.postMessage(
                  { type: 'sbTrigger', key: 'lt_trigger', value: p.value, slot: p.slot || '' }, '*'
                );
              }
            } catch {}
            return;
          }
          if (p.key === 'lineup_trigger') {
            setTimeout(function() {
              try { document.getElementById('overlay-3-frame')?.contentWindow?.pollTrigger?.(); } catch {}
            }, 120);
            return;
          }
          const iframe = customFrameMap[p.key];
          if (!iframe) return;
          const prevBc = customState[p.key];
          if (prevBc === p.value) return;
          customState[p.key] = p.value;
          customStateTime[p.key] = Date.now();
          try {
            if (p.value === 'in') iframe.contentWindow?.runAnimationIN?.();
            else if (p.value === 'out') {
              if (prevBc === 'in') iframe.contentWindow?.runAnimationOUT?.();
              else if (iframe.contentWindow?.__forceOut) iframe.contentWindow.__forceOut();
            }
          } catch {}
        })
        .subscribe();
    }

    // Raw WebSocket — postgres_changes for instant custom grafik + lineup_trigger + komm-triggers
    if (pid) {
      (function() {
        var _ws = null, _ref = 0, _hb = null;
        function _dispatch(key, value) {
          if (key === 'lineup_trigger') {
            setTimeout(function() {
              try { document.getElementById('overlay-3-frame')?.contentWindow?.pollTrigger?.(); } catch {}
            }, 120);
            return;
          }
          var cIframe = customFrameMap[key];
          if (!cIframe) return;
          var cPrev = customState[key];
          if (cPrev === value) return;
          customState[key] = value;
          customStateTime[key] = Date.now();
          try {
            if (value === 'in') cIframe.contentWindow?.runAnimationIN?.();
            else if (value === 'out') {
              if (cPrev === 'in') cIframe.contentWindow?.runAnimationOUT?.();
              else if (cIframe.contentWindow?.__forceOut) cIframe.contentWindow.__forceOut();
            }
          } catch {}
        }
        function _wsConnect() {
          try {
            _ws = new WebSocket('wss://rxzxdcweqpbnvfkpnnrn.supabase.co/realtime/v1/websocket?apikey=' + SB_ANON + '&vsn=1.0.0');
            _ws.onopen = function() {
              _ws.send(JSON.stringify({ topic: 'realtime:triggers-' + pid, event: 'phx_join',
                payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' },
                  postgres_changes: [
                    { event: 'UPDATE', schema: 'public', table: 'settings', filter: 'projekt_id=eq.' + pid },
                    { event: 'INSERT', schema: 'public', table: 'settings', filter: 'projekt_id=eq.' + pid }
                  ] }, access_token: SB_ANON }, ref: String(++_ref) }));
              _hb = setInterval(function() {
                if (_ws && _ws.readyState === 1)
                  _ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++_ref) }));
              }, 25000);
            };
            _ws.onmessage = function(e) {
              try {
                var msg = JSON.parse(e.data);
                if (!msg || msg.event !== 'postgres_changes') return;
                if (!msg.payload || !msg.payload.data) return;
                var rec = msg.payload.data.record;
                if (!rec || rec.projekt_id !== pid) return;
                if (rec.key === 'lt_trigger' || rec.key === 'lt_slot') return;
                _dispatch(rec.key, rec.value);
              } catch {}
            };
            _ws.onclose = function() { clearInterval(_hb); _hb = null; setTimeout(_wsConnect, 3000); };
            _ws.onerror = function() { try { _ws.close(); } catch {} };
          } catch {}
        }
        _wsConnect();
      })();
    }

    async function loadCustomGrafik() {
      if (!pid) return;

      // Indlæs custom grafik-filer (fejl stopper ikke broadcast-kanalen nedenfor)
      try {
        const allRows = await fetch(
          `${SB_URL}/rest/v1/projekt_grafik?projekt_id=eq.${encodeURIComponent(pid)}&order=sort_order`,
          { headers: SB_HDR }
        ).then(r => r.json());
        const rows = Array.isArray(allRows) ? allRows.filter(g => g.overlay_mode !== 'standalone' && g.overlay_target !== 'komm') : [];
        if (rows.length) {
          await Promise.all(rows.map(async g => {
            const frameId = 'custom-' + g.id.slice(0, 8) + '-frame';
            if (document.getElementById(frameId)) return;
            let html;
            try { html = await fetch(g.file_url, { cache: 'no-store' }).then(r => r.text()); } catch { return; }
            // Bloker Supabase realtime og fetch i iframen — overlay.html styrer al trigger-logik direkte
            const _ahs = (g.auto_hide_seconds > 0) ? Number(g.auto_hide_seconds) : 0;
            const inject = `<script>window.__PROJEKT_ID=${JSON.stringify(pid)};window.__IS_PREVIEW=false;(function(){var _f=window.fetch;window.fetch=function(u,o){if(typeof u==='string'&&u.indexOf('supabase.co')!==-1)return Promise.resolve({ok:true,json:function(){return Promise.resolve([])}});return _f.apply(this,arguments);};})();window.__forceOut=function(){if(typeof window._spxVisible!=='undefined')window._spxVisible=false;if(window.gsap)window.gsap.killTweensOf('*');if(document.body)document.body.style.opacity='0';};document.addEventListener('DOMContentLoaded',function(){if(document.body)document.body.style.opacity='0';var _ahs=${_ahs};var _aht=null;var _o=window.runAnimationIN;if(typeof _o==='function')window.runAnimationIN=function(){if(document.body)document.body.style.opacity='';if(_aht){clearTimeout(_aht);_aht=null;}_o.apply(this,arguments);if(_ahs>0)_aht=setTimeout(function(){_aht=null;if(typeof window.runAnimationOUT==='function')window.runAnimationOUT();},_ahs*1000);};});Object.defineProperty(window,'supabase',{value:{createClient:()=>({channel:()=>({on:()=>({on:()=>({subscribe:()=>{}}),subscribe:()=>{}}),subscribe:()=>{}})})},writable:false,configurable:false});<\/script>`;
            const injectedHtml = html.replace(/(<html[^>]*>)/i, '$1' + inject);
            html = injectedHtml.includes('__PROJEKT_ID') ? injectedHtml : inject + html;
            const blob = new Blob([html], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            const iframe = document.createElement('iframe');
            iframe.id = frameId;
            iframe.allowTransparency = true;
            iframe.src = blobUrl;
            iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;background:transparent;pointer-events:none;';
            document.body.appendChild(iframe);
            const shortId = 'custom-' + g.id.slice(0, 8);
            if (!DEFAULT_ORDER.includes(shortId)) DEFAULT_ORDER.push(shortId);
            customFrameMap[g.trigger_key] = iframe;
            customState[g.trigger_key] = 'out';
          }));
          applyOrder(DEFAULT_ORDER);
        }
      } catch {}

    }

    // Polling for custom grafik — kører fra page load som fallback hvis broadcast misses.
    // customFrameMap er tom indtil loadCustomGrafik udfylder den, men pollingen kører
    // allerede så den fanger triggers der ankommer mens iframen loades.
    async function pollCustomTriggers() {
      if (!pid) { setTimeout(pollCustomTriggers, 5000); return; }
      const trigKeys = Object.keys(customFrameMap);
      if (trigKeys.length) {
        try {
          const data = await fetch(
            `${SB_URL}/rest/v1/settings?key=in.(${trigKeys.join(',')})&projekt_id=eq.${encodeURIComponent(pid)}&select=key,value`,
            { headers: SB_HDR }
          ).then(r => r.json());
          if (Array.isArray(data)) {
            for (const row of data) {
              if (Date.now() - (customStateTime[row.key] || 0) < 3000) continue;
              if (customState[row.key] === row.value) continue;
              const prev = customState[row.key];
              customState[row.key] = row.value;
              const iframe = customFrameMap[row.key];
              if (!iframe) continue;
              try {
                if (row.value === 'in') iframe.contentWindow?.runAnimationIN?.();
                else if (row.value === 'out') {
                  if (prev === 'in') iframe.contentWindow?.runAnimationOUT?.();
                  else if (iframe.contentWindow?.__forceOut) iframe.contentWindow.__forceOut();
                }
              } catch {}
            }
          }
        } catch {}
      }
      setTimeout(pollCustomTriggers, 5000);
    }

    // Sæt standard-rækkefølge med det samme og start polling med det samme.
    // loadCustomGrafik kører parallelt; pollCustomTriggers kører uafhængigt fra start.
    applyOrder(DEFAULT_ORDER);
    pollLagOrder();
    loadCustomGrafik();
    pollCustomTriggers();

  </script>
</body>
</html>
