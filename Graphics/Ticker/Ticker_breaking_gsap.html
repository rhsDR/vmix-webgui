<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
#hiddenSpxData{display:none;}
#el2{position:absolute;left:450px;top:985px;width:1489px;height:81px;transform-origin:left top;background:linear-gradient(to right,#ffc933 0%,#ffc933 100%);border-radius:0px;clip-path:inset(50% 0);}
#el19{position:absolute;left:452px;top:987px;width:1479px;height:79px;transform-origin:center center;opacity:0;}
#el19{overflow:hidden;display:flex;align-items:center;}
#el19-inner{white-space:nowrap;display:inline-block;font-size:24px;font-weight:400;font-family:'DM Sans',sans-serif;color:#ffffff;}
.t-hl{font-weight:700;}.t-tx{font-weight:400;}

</style>
</head>
<body>
  <div id="el2"></div>
  <div id="el19"><div id="el19-inner"></div></div>
<div id="hiddenSpxData">  <div id="f0"></div></div>
<script>
function clean(v){return(!v||v==='$NA')?'':String(v).trim();}
function _prefetchAndPlay(cb){cb();}
var _spxVisible=false;
function _updateContent(data){
  (function(){var t=clean((data&&data.f0!=null)?String(data.f0):document.getElementById('f0').innerText);var items=t.split('|').map(function(s){return s.trim();}).filter(Boolean);function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}var txt=items.map(escHtml).join('      <span style="font-weight:900">BREAKING</span>      ');var full=txt+'      <span style="font-weight:900">BREAKING</span>      '+txt;var w=document.getElementById('el19');if(w&&w._tickerUpdate){w._tickerUpdate(full);}else{var inn=document.getElementById('el19-inner');if(inn)inn.innerHTML=full;}})();
  (function(){var r=document.getElementById('el2');var s=document.getElementById('el5');if(r&&s){r.style.left=(s.offsetLeft+-38)+'px';r.style.width=Math.max(1,s.offsetWidth+337)+'px';}})();
}
function runTemplateUpdate(data){_updateContent(data);function _apply(){_prefetchAndPlay(function(){setTimeout(runAnimationIN,50);});}if(_spxVisible){runAnimationOUT();setTimeout(_apply,1321);}else{_apply();}}
window.onSpxUpdate=function(data){_updateContent(data);};
document.addEventListener('DOMContentLoaded',function(){
(function(){var wrap=document.getElementById('el19');var inner=document.getElementById('el19-inner');if(!inner||!wrap)return;var speed=120;var pos=wrap.offsetWidth;var pending=null;var last=null;wrap._tickerUpdate=function(t){if(!inner.innerHTML){inner.innerHTML=t;pos=wrap.offsetWidth;}else if(t!==inner.innerHTML){pending=t;}};function step(ts){if(last===null){last=ts;requestAnimationFrame(step);return;}var dt=(ts-last)/1000;last=ts;pos-=speed*dt;var half=inner.scrollWidth/2;if(half>0&&pos<-half){if(pending!==null){inner.innerHTML=pending;pending=null;half=inner.scrollWidth/2;}pos+=half;}inner.style.transform='translateX('+Math.round(pos)+'px)';requestAnimationFrame(step);}requestAnimationFrame(step);})();
});
function runAnimationIN(){_spxVisible=true;
  var tl=gsap.timeline();
  tl.fromTo('#el2',{clipPath:'inset(50% 0% 50% 0%)',immediateRender:true},{clipPath:'inset(0% 0% 0% 0%)',duration:0.48,ease:'power2.inOut'},0);
  tl.fromTo('#el19',{opacity:0,immediateRender:true},{opacity:1,duration:0.45,ease:'power3.out'},0.398);
}
function runAnimationOUT(){_spxVisible=false;
  var tl=gsap.timeline();
  tl.to('#el2',{clipPath:'inset(50% 0% 50% 0%)',duration:0.34,ease:'power2.in'},0.881);
  tl.to('#el19',{opacity:0,duration:0.18,ease:'power2.in'},0.889);
}

// ── SUPABASE INTEGRATION ──
var _SB_URL='https://rxzxdcweqpbnvfkpnnrn.supabase.co';
var _SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4enhkY3dlcXBibnZma3BubnJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMzYzMTUsImV4cCI6MjA5MDgxMjMxNX0.e6DtMVskOwcMyJBFJDIEYsSZC0HAcD7AhNcg5PvlArU';
var _SB_HDR={'apikey':_SB_ANON,'Authorization':'Bearer '+_SB_ANON};
var _pid=window.__PROJEKT_ID||new URLSearchParams(window.location.search).get('p')||'';
var _prv=window.__IS_PREVIEW||new URLSearchParams(window.location.search).has('preview');
var _trigKey='breaking_trigger'+(_prv?'_prv':'');
var _lastBcTime={};
(function(){
  if(!_pid)return;
  var _sbBc=window.supabase.createClient(_SB_URL,_SB_ANON);
  _sbBc.channel('triggers-'+_pid)
    .on('broadcast',{event:'trigger'},function(msg){
      var p=msg.payload;
      if(p.projekt_id!==_pid||p.key!==_trigKey)return;
      _lastBcTime[p.key]=Date.now();
      if(p.value==='in'&&!_spxVisible)runAnimationIN();
      if(p.value==='out'&&_spxVisible)runAnimationOUT();
    }).subscribe();
})();
document.addEventListener('DOMContentLoaded',function(){
  if(!_pid)return;
  function _loadContent(){
    fetch(_SB_URL+'/rest/v1/tickers?on_air=eq.true&breaking=eq.true&projekt_id=eq.'+_pid+'&order=slot&select=tekst,overskrift',{headers:_SB_HDR})
      .then(function(r){return r.json();})
      .then(function(rows){
        var SEP='     •     ';
        var items=rows.filter(function(r){return r.tekst||r.overskrift;}).map(function(r){
          var s='';
          if(r.overskrift)s+='<span class="t-hl">'+r.overskrift+'</span>';
          if(r.tekst)s+='<span class="t-tx">'+(r.overskrift?' ':'')+r.tekst+'</span>';
          return s;
        });
        if(!items.length)return;
        var full=items.join(SEP);
        var w=document.getElementById('el19');
        if(w&&w._tickerUpdate)w._tickerUpdate(full+SEP+full);
      }).catch(function(){});
  }
  _loadContent();
  setInterval(_loadContent,15000);
  // Initial trigger state
  fetch(_SB_URL+'/rest/v1/settings?key=eq.'+_trigKey+'&projekt_id=eq.'+_pid+'&select=value',{headers:_SB_HDR})
    .then(function(r){return r.json();}).then(function(rows){if(rows[0]&&rows[0].value==='in'&&!_spxVisible)runAnimationIN();}).catch(function(){});
  // Postgres fallback
  var _sbT=window.supabase.createClient(_SB_URL,_SB_ANON);
  _sbT.channel('prod-'+_trigKey+'-'+_pid)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'settings'},function(p){
      if(p.new.projekt_id!==_pid)return;
      if(_lastBcTime[p.new.key]&&Date.now()-_lastBcTime[p.new.key]<3000)return;
      if(p.new.key===_trigKey){
        if(p.new.value==='in'&&!_spxVisible)runAnimationIN();
        if(p.new.value==='out'&&_spxVisible)runAnimationOUT();
      }
    }).subscribe();
  window.supabase.createClient(_SB_URL,_SB_ANON)
    .channel('ticker-breaking-content-'+_pid)
    .on('postgres_changes',{event:'*',schema:'public',table:'tickers'},_loadContent)
    .subscribe();
});
window.SPXGCTemplateDefinition={"description":"Smart Ticker","DataFields":[]};
window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'ovl-trigger') return;
  if (e.data.action === 'in') { if (typeof runAnimationIN === 'function') runAnimationIN(); }
  else if (e.data.action === 'out') { if (typeof runAnimationOUT === 'function') runAnimationOUT(); }
});
</script>
</body>
</html>
