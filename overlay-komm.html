<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Komm Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="komm-k1-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k2-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k3-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k4-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k5-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k6-frame" allowtransparency="true" src=""></iframe>
  <script>
    const _pid = new URLSearchParams(window.location.search).get('p') || '';
    [1,2,3,4,5,6].forEach(function(n){
      document.getElementById('komm-k'+n+'-frame').src =
        'Graphics/Komm_score_boks/Komm_BOKS_K-'+n+'.html?p=' + _pid;
    });
  </script>
</body>
</html>
