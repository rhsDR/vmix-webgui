<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Komm Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="komm-k1-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k2-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k3-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k4-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k5-frame" allowtransparency="true" src=""></iframe>
  <iframe id="komm-k6-frame" allowtransparency="true" src=""></iframe>
  <script>
    const _params = new URLSearchParams(window.location.search);
    const _pid    = _params.get('p') || '';
    const _testOt = _params.get('test_ot') || '';
    [1,2,3,4,5,6].forEach(function(n){
      let src = 'Graphics/Komm_score_boks/Komm_BOKS_K-'+n+'.html?p=' + _pid;
      if (_testOt) src += '&test_ot=' + encodeURIComponent(_testOt);
      document.getElementById('komm-k'+n+'-frame').src = src;
    });

    const SB_URL  = 'https://rxzxdcweqpbnvfkpnnrn.supabase.co';
    const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4enhkY3dlcXBibnZma3BubnJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMzYzMTUsImV4cCI6MjA5MDgxMjMxNX0.e6DtMVskOwcMyJBFJDIEYsSZC0HAcD7AhNcg5PvlArU';
    const SB_HDR  = { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON };
    const customFrameMap = {};
    const customState    = {};
    const customStateTime = {};

    // Built-in grafikker der kan flyttes til komm-overlay via grafikOverlayMap
    const BUILTIN_GRAPHICS = [
      { id: 'lower-third', file: 'lower-third.html',    trigKey: 'lt_trigger' },
      { id: 'ticker',      file: 'Graphics/Ticker/Ticker_gsap.html', trigKey: 'ticker_ovl_trigger' },
      { id: 'breaking',    file: 'breaking.html',        trigKey: 'breaking_trigger' },
      { id: 'live-boks',   file: 'Graphics/LIve_bokse/Live_BOKS_gsap.html', trigKey: 'live_boks_trigger' },
      { id: 'overlay-3',   file: 'OverLay_3.html',        trigKey: 'lineup_trigger' },
      { id: 'credits',     file: 'credits.html',         trigKey: 'credits_trigger' },
    ];

    // Raw WebSocket — postgres_changes for instant Companion-triggers på alle 6 komm-bokse + custom grafikker
    if (_pid) {
      (function() {
        var _ws = null, _ref = 0, _hb = null, _pgState = {};
        var _TRIG = {
          'Komm_score_K-1': 'komm-k1-frame',
          'Komm_score_K-2': 'komm-k2-frame',
          'Komm_score_K-3': 'komm-k3-frame',
          'Komm_score_K-4': 'komm-k4-frame',
          'Komm_score_K-5': 'komm-k5-frame',
          'Komm_score_K-6': 'komm-k6-frame',
        };
        function _dispatch(key, value, slot) {
          // lt_trigger: lower-third bruger postMessage (ikke direkte runAnimationIN/OUT)
          if (key === 'lt_trigger') {
            var ltFrame = document.getElementById('builtin-lower-third-frame');
            if (ltFrame && ltFrame.contentWindow) {
              try { ltFrame.contentWindow.postMessage({ type: 'sbTrigger', key: 'lt_trigger', value: value, slot: slot || '' }, '*'); } catch {}
            }
            return;
          }
          // Hardcodede komm-bokse
          var frameId = _TRIG[key];
          if (frameId) {
            var iframe = document.getElementById(frameId);
            if (!iframe) return;
            _pgState[key] = value;
            try {
              // Tjek _spxVisible direkte — undgår dobbelt-kald når intern subscription allerede håndterede det
              if (value === 'in') { if (!iframe.contentWindow?._spxVisible) iframe.contentWindow?.runAnimationIN?.(); }
              else if (value === 'out') { if (iframe.contentWindow?._spxVisible) iframe.contentWindow?.runAnimationOUT?.(); }
            } catch {}
            return;
          }
          // Custom grafikker med overlay_target='komm'
          var cIframe = customFrameMap[key];
          if (!cIframe) return;
          var cPrev = customState[key];
          if (cPrev === value) return;
          customState[key] = value;
          customStateTime[key] = Date.now();
          try {
            if (value === 'in') cIframe.contentWindow?.runAnimationIN?.();
            else if (value === 'out') {
              if (cPrev === 'in') cIframe.contentWindow?.runAnimationOUT?.();
              else if (cIframe.contentWindow?.__forceOut) cIframe.contentWindow.__forceOut();
            }
          } catch {}
        }
        function _wsConnect() {
          try {
            _ws = new WebSocket('wss://rxzxdcweqpbnvfkpnnrn.supabase.co/realtime/v1/websocket?apikey=' + SB_ANON + '&vsn=1.0.0');
            _ws.onopen = function() {
              _ws.send(JSON.stringify({ topic: 'realtime:triggers-' + _pid, event: 'phx_join',
                payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' },
                  postgres_changes: [
                    { event: 'UPDATE', schema: 'public', table: 'settings', filter: 'projekt_id=eq.' + _pid },
                    { event: 'INSERT', schema: 'public', table: 'settings', filter: 'projekt_id=eq.' + _pid }
                  ] }, access_token: SB_ANON }, ref: String(++_ref) }));
              _hb = setInterval(function() {
                if (_ws && _ws.readyState === 1)
                  _ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++_ref) }));
              }, 25000);
            };
            _ws.onmessage = function(e) {
              try {
                var msg = JSON.parse(e.data);
                if (!msg || msg.event !== 'postgres_changes') return;
                if (!msg.payload || !msg.payload.data) return;
                var rec = msg.payload.data.record;
                if (!rec || rec.projekt_id !== _pid) return;
                if (rec.key === 'overlay_lag_order') {
                  var order = rec.value ? rec.value.split(',').map(function(s){return s.trim();}).filter(Boolean) : [];
                  document.body.querySelectorAll('iframe[id]').forEach(function(f) {
                    var id = f.id.replace('builtin-','').replace('-frame','').replace('custom-komm-','custom-');
                    var idx = order.indexOf(id);
                    if (idx >= 0) f.style.zIndex = String((order.length - idx) * 1000);
                  });
                  return;
                }
                _dispatch(rec.key, rec.value, rec.slot);
              } catch {}
            };
            _ws.onclose = function() { clearInterval(_hb); _hb = null; setTimeout(_wsConnect, 3000); };
            _ws.onerror = function() { try { _ws.close(); } catch {} };
          } catch {}
        }
        _wsConnect();
      })();
    }

    async function loadCustomGrafik() {
      if (!_pid) return;
      try {
        const [mapRows, lagRows] = await Promise.all([
          fetch(`${SB_URL}/rest/v1/settings?projekt_id=eq.${encodeURIComponent(_pid)}&key=eq.grafik_overlay_map&select=value`, { headers: SB_HDR }).then(r => r.json()),
          fetch(`${SB_URL}/rest/v1/settings?projekt_id=eq.${encodeURIComponent(_pid)}&key=eq.overlay_lag_order&select=value`, { headers: SB_HDR }).then(r => r.json()),
        ]);
        const grafMap  = (Array.isArray(mapRows) && mapRows[0]?.value) ? JSON.parse(mapRows[0].value) : {};
        const lagOrder = lagRows[0]?.value ? lagRows[0].value.split(',').map(s => s.trim()).filter(Boolean) : [];

        // z-index baseret på overlay_lag_order — samme formel som overlay.html's applyOrder
        function zForId(id) {
          const idx = lagOrder.indexOf(id);
          return idx >= 0 ? String((lagOrder.length - idx) * 1000) : '500';
        }

        // Komm bokse — kun i dette overlay hvis 'komm' er tildelt 'komm' (default)
        const kommTarget = grafMap['komm'] || 'komm';
        [1,2,3,4,5,6].forEach(function(n) {
          const frame = document.getElementById('komm-k'+n+'-frame');
          if (!frame) return;
          if (kommTarget === 'komm') {
            let src = 'Graphics/Komm_score_boks/Komm_BOKS_K-'+n+'.html?p=' + _pid;
            if (_testOt) src += '&test_ot=' + encodeURIComponent(_testOt);
            if (frame.src !== src) frame.src = src;
          } else {
            frame.src = 'about:blank';
          }
        });

        // Built-in grafikker tildelt 'komm'
        for (const bg of BUILTIN_GRAPHICS) {
          if ((grafMap[bg.id] || 'hoved') !== 'komm') continue;
          const frameId = 'builtin-' + bg.id + '-frame';
          if (document.getElementById(frameId)) continue;
          const iframe = document.createElement('iframe');
          iframe.id = frameId;
          iframe.allowTransparency = true;
          iframe.src = bg.file + '?p=' + _pid;
          iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;background:transparent;pointer-events:none;z-index:' + zForId(bg.id) + ';';
          document.body.appendChild(iframe);
        }

        const allRows = await fetch(
          `${SB_URL}/rest/v1/projekt_grafik?projekt_id=eq.${encodeURIComponent(_pid)}&order=sort_order`,
          { headers: SB_HDR }
        ).then(r => r.json());
        const rows = Array.isArray(allRows)
          ? allRows.filter(g => g.overlay_mode !== 'standalone' && g.overlay_target === 'komm')
          : [];
        if (!rows.length) return;
        await Promise.all(rows.map(async g => {
          const frameId = 'custom-komm-' + g.id.slice(0, 8) + '-frame';
          if (document.getElementById(frameId)) return;
          let html;
          try { html = await fetch(g.file_url, { cache: 'no-store' }).then(r => r.text()); } catch { return; }
          const _ahs = (g.auto_hide_seconds > 0) ? Number(g.auto_hide_seconds) : 0;
          const inject = `<script>window.__PROJEKT_ID=${JSON.stringify(_pid)};window.__IS_PREVIEW=false;(function(){var _f=window.fetch;window.fetch=function(u,o){if(typeof u==='string'&&u.indexOf('supabase.co')!==-1)return Promise.resolve({ok:true,json:function(){return Promise.resolve([])}});return _f.apply(this,arguments);};})();window.__forceOut=function(){if(typeof window._spxVisible!=='undefined')window._spxVisible=false;if(window.gsap)window.gsap.killTweensOf('*');if(document.body)document.body.style.opacity='0';};document.addEventListener('DOMContentLoaded',function(){if(document.body)document.body.style.opacity='0';var _ahs=${_ahs};var _aht=null;var _o=window.runAnimationIN;if(typeof _o==='function')window.runAnimationIN=function(){if(document.body)document.body.style.opacity='';if(_aht){clearTimeout(_aht);_aht=null;}_o.apply(this,arguments);if(_ahs>0)_aht=setTimeout(function(){_aht=null;if(typeof window.runAnimationOUT==='function')window.runAnimationOUT();},_ahs*1000);};});Object.defineProperty(window,'supabase',{value:{createClient:()=>({channel:()=>({on:()=>({on:()=>({subscribe:()=>{}}),subscribe:()=>{}}),subscribe:()=>{}})})},writable:false,configurable:false});<\/script>`;
          const injectedHtml = html.replace(/(<html[^>]*>)/i, '$1' + inject);
          html = injectedHtml.includes('__PROJEKT_ID') ? injectedHtml : inject + html;
          const blob = new Blob([html], { type: 'text/html' });
          const iframe = document.createElement('iframe');
          iframe.id = frameId;
          iframe.allowTransparency = true;
          iframe.src = URL.createObjectURL(blob);
          iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;background:transparent;pointer-events:none;z-index:' + zForId('custom-' + g.id.slice(0,8)) + ';';
          document.body.appendChild(iframe);
          customFrameMap[g.trigger_key] = iframe;
          customState[g.trigger_key] = 'out';
        }));
      } catch {}
    }

    // Ét initial fetch af custom grafik trigger-state efter iframes er loaded.
    // WS onmessage håndterer alle efterfølgende ændringer øjeblikkeligt.
    async function fetchInitialCustomState() {
      if (!_pid) return;
      const keys = Object.keys(customFrameMap);
      if (!keys.length) return;
      try {
        const data = await fetch(
          `${SB_URL}/rest/v1/settings?key=in.(${keys.map(k=>encodeURIComponent(k)).join(',')})&projekt_id=eq.${encodeURIComponent(_pid)}&select=key,value`,
          { headers: SB_HDR }
        ).then(r => r.json());
        if (!Array.isArray(data)) return;
        for (const row of data) {
          if (customState[row.key] === row.value) continue;
          const prev = customState[row.key];
          customState[row.key] = row.value;
          const iframe = customFrameMap[row.key];
          if (!iframe) continue;
          try {
            if (row.value === 'in') iframe.contentWindow?.runAnimationIN?.();
            else if (row.value === 'out') {
              if (prev === 'in') iframe.contentWindow?.runAnimationOUT?.();
              else if (iframe.contentWindow?.__forceOut) iframe.contentWindow.__forceOut();
            }
          } catch {}
        }
      } catch {}
    }

    loadCustomGrafik().then(fetchInitialCustomState);
  </script>
</body>
</html>
