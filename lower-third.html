<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/realtime-ws.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
#hiddenSpxData{display:none;}
@font-face{font-family:'DRPublik-SemiBold';src:url('fonts/DRPublik-SemiBold.otf') format('opentype');}
@font-face{font-family:'DRPublik-Regular';src:url('fonts/DRPublik-Regular.otf') format('opentype');}
@font-face{font-family:'DRPublik-BlackItalic';src:url('fonts/DRPublik-BlackItalic.otf') format('opentype');}
#el2{position:absolute;left:159px;top:839px;width:739px;height:140px;transform-origin:left top;background:linear-gradient(to right,#00004b 0%,rgba(0,0,0,0) 100%);border-radius:0px;clip-path:inset(0% 100% 0% 0%);}
#el6{position:absolute;left:200px;top:914px;width:1700px;height:60px;transform-origin:left top;color:#ffffff;font-size:30px;font-weight:400;font-style:normal;font-family:'DRPublik-Regular',sans-serif;white-space:nowrap;display:flex;align-items:center;justify-content:flex-start;}
#el12{position:absolute;left:200px;top:818px;width:121px;height:40px;transform-origin:left top;background:#ffd200;border-radius:0px;}
#el5{position:absolute;left:197px;top:864px;width:max-content;height:60px;transform-origin:left top;color:#ffffff;font-size:60px;font-weight:700;font-style:normal;font-family:'DRPublik-SemiBold',sans-serif;white-space:nowrap;display:flex;align-items:center;justify-content:flex-start;}
#el7{position:absolute;left:200px;top:818px;width:121px;height:40px;transform-origin:left top;color:#00004b;font-size:32px;font-weight:400;font-style:italic;font-family:'DRPublik-BlackItalic',sans-serif;white-space:nowrap;display:flex;align-items:center;justify-content:center;}
[id^="grp-"]{position:absolute;inset:0;}
#lt-wrap{position:absolute;top:0;left:0;width:1920px;height:1080px;}
#lt-wrap.pos-hoejre{transform:scaleX(-1);transform-origin:center;}
.lt-text{display:inline-block;}
#lt-wrap.pos-hoejre .lt-text{transform:scaleX(-1);}
#grp-grp13{clip-path:inset(838px 0% 242px 0%);}

</style>
</head>
<body>
<div id="lt-wrap" class="pos-venstre">
  <div id="el2"></div>
  <div id="el6" class="lt-text"><span style="opacity:0">B</span><span style="opacity:0">a</span><span style="opacity:0">d</span><span style="opacity:0">m</span><span style="opacity:0">i</span><span style="opacity:0">n</span><span style="opacity:0">t</span><span style="opacity:0">o</span><span style="opacity:0">n</span><span style="opacity:0">s</span><span style="opacity:0">p</span><span style="opacity:0">i</span><span style="opacity:0">l</span><span style="opacity:0">l</span><span style="opacity:0">e</span><span style="opacity:0">r</span></div>
  <div id="grp-grp13">
  <div id="el12"></div>
  <div id="el7" class="lt-text"><span style="opacity:0">S</span><span style="opacity:0">P</span><span style="opacity:0">O</span><span style="opacity:0">R</span><span style="opacity:0">T</span></div>
  </div>
  <div id="el5" class="lt-text"><span style="opacity:0">V</span><span style="opacity:0">i</span><span style="opacity:0">c</span><span style="opacity:0">t</span><span style="opacity:0">o</span><span style="opacity:0">r</span><span style="opacity:0">&nbsp;</span><span style="opacity:0">A</span><span style="opacity:0">x</span><span style="opacity:0">e</span><span style="opacity:0">l</span><span style="opacity:0">s</span><span style="opacity:0">e</span><span style="opacity:0">n</span></div>
</div>
<div id="hiddenSpxData">
  <div id="f0"></div>
  <div id="f1"></div>
  <div id="f2"></div>
  <div id="f3"></div>
</div>
<script>
function clean(v){return(!v||v==='$NA')?'':String(v).trim();}
window.SPXGroups={"grp13":["el12","el7"]};
var _WS_PTS=[[0,0],[0.08,0.09],[0.19,0.23],[0.31,0.36],[0.42,0.47],[0.54,0.58],[0.65,0.70],[0.76,0.81],[0.86,0.90],[0.94,0.97],[1.0,1.0]];function _csSteps(n,mode,count){if(!n)return[];if(mode==='one')return Array.from({length:n},function(_,i){return{t:i/n,show:i+1};});if(mode==='multi'){var k=Math.max(1,count||3),st=Math.ceil(n/k);return Array.from({length:st},function(_,i){return{t:i/Math.max(1,st),show:Math.min(n,(i+1)*k)};});}return _WS_PTS.map(function(pt){return{t:pt[0],show:Math.round(pt[1]*n)};});}function _csPlay(id,dur,delay,mode,count,op){var e=document.getElementById(id);if(!e)return;if(e._csT){e._csT.forEach(clearTimeout);e._csT=[];}gsap.set('#'+id,{opacity:1,immediateRender:true});var sp=e.querySelectorAll('span');sp.forEach(function(x){x.style.opacity='0';});e._csT=_csSteps(sp.length,mode,count).map(function(s){return setTimeout(function(){sp.forEach(function(x,i){x.style.opacity=i<s.show?op:'0';});},Math.round(delay*1000+s.t*dur*1000+80));});}
function _prefetchAndPlay(cb){cb();}
var _spxVisible=false;

/* ── SUPABASE INTEGRATION BLOCK ── START
   Kopiér denne blok til nye versioner af lower-third.html.
   Krav til HTML-filen:
     - var _spxVisible = false
     - function _updateContent(data)  — data.f0=titel, data.f1=navn, data.f2=label, data.f3=side
     - function runAnimationIN(skipLabel)
     - function runAnimationOUT(keepLabel)
     - <script src="js/supabase-config.js"> + js/realtime-ws.js indlæst FØR denne blok
   ────────────────────────────────────── */
// SB_URL / SB_ANON / SB_HDR kommer fra js/supabase-config.js
const _params    = new URLSearchParams(window.location.search);
const _pid       = _params.get('p') || '';
const _pf        = _pid ? '&projekt_id=eq.' + encodeURIComponent(_pid) : '';
const _isPreview = _params.has('preview');
const _sfx       = _isPreview ? '_prv' : '';
let _animating      = false;
let _currentSlot    = null;
let _currentTrigger = null; // 'in' | 'vmixcall' — hvilken type er på air

async function pollTrigger() {
  if (_animating) { setTimeout(pollTrigger, 2000); return; }
  try {
    const rows = await fetch(
      SB_URL + '/rest/v1/settings?select=key,value&key=in.(lt_trigger' + _sfx + ',lt_slot' + _sfx + ')' + _pf,
      { headers: SB_HDR }
    ).then(r => r.json());
    const trigger = rows.find(r => r.key === 'lt_trigger' + _sfx)?.value;
    const slot    = rows.find(r => r.key === 'lt_slot'    + _sfx)?.value;


    if (trigger === 'update' && _spxVisible && slot && slot !== _currentSlot && _currentTrigger !== 'vmixcall') {
      const sub = _subsCache[slot];
      if (sub) {
        _animating = true;
        _currentSlot    = slot;
        _currentTrigger = 'in';
        _updateContent({ f0: sub.titel || '', f1: sub.navn || '', f2: 'SPORT', f3: 'venstre' });
        _csPlay('el5', 0.24, 0,    'irregular',  3, 1);
        _csPlay('el6', 0.24, 0.08, 'wipe-step',  3, 1);
        setTimeout(() => { _animating = false; setTimeout(pollTrigger, 2000); }, 900);
        return;
      }
    } else if (trigger === 'vmixcall' && (!_spxVisible || slot !== _currentSlot || _currentTrigger !== 'vmixcall')) {
      if (!slot) { setTimeout(pollTrigger, 2000); return; }
      const call = _vmixCache[slot];
      if (call) {
        _animating = true;
        const doShow = (skipLabel) => {
          _currentSlot    = slot;
          _currentTrigger = 'vmixcall';
          _updateContent({ f0: call.titel || '', f1: call.navn || '', f2: 'SPORT', f3: 'venstre' });
          setTimeout(() => runAnimationIN(skipLabel), 50);
          setTimeout(() => { _animating = false; setTimeout(pollTrigger, 2000); }, 2700);
        };
        if (_spxVisible) { runAnimationOUT(false); setTimeout(() => doShow(true), 2200); }
        else              { doShow(false); }
        return;
      }
    } else if (trigger === 'in' && (!_spxVisible || slot !== _currentSlot || _currentTrigger === 'vmixcall')) {
      if (!slot) { setTimeout(pollTrigger, 2000); return; }
      const sub = _subsCache[slot];
      if (sub) {
        _animating = true;
        const doShow = (skipLabel) => {
          _currentSlot    = slot;
          _currentTrigger = 'in';
          _updateContent({ f0: sub.titel || '', f1: sub.navn || '', f2: 'SPORT', f3: 'venstre' });
          setTimeout(() => runAnimationIN(skipLabel), 50);
          setTimeout(() => { _animating = false; setTimeout(pollTrigger, 2000); }, 2700);
        };
        if (_spxVisible) { runAnimationOUT(false); setTimeout(() => doShow(true), 2200); }
        else              { doShow(false); }
        return;
      }
    } else if (trigger === 'out' && _spxVisible) {
      _animating = true;
      runAnimationOUT(false);
      setTimeout(() => { _currentSlot = null; _currentTrigger = null; _animating = false; setTimeout(pollTrigger, 2000); }, 2600);
      return;
    }
  } catch(e) { console.error('LT poll fejl:', e); }
  setTimeout(pollTrigger, 500);
}
pollTrigger();
var _subsCache = {};
var _vmixCache = {};
if (_pid) {
  fetch(SB_URL + '/rest/v1/subs?select=slot,navn,titel' + _pf, { headers: SB_HDR })
    .then(r => r.json()).then(rows => rows.forEach(r => { _subsCache[String(r.slot)] = r; })).catch(() => {});
  fetch(SB_URL + '/rest/v1/vmix_calls?select=slot,navn,titel' + _pf, { headers: SB_HDR })
    .then(r => r.json()).then(rows => rows.forEach(r => { _vmixCache[String(r.slot)] = r; })).catch(() => {});
}
// Fælles realtime-forbindelse (js/realtime-ws.js) — broadcast (web UI) + postgres_changes (Companion)
(function() {
  if (!_pid) return;
  var _pgSlot = '';
  createRealtimeWS({
    topic: 'triggers-' + _pid,
    postgresChanges: [
      { event: 'UPDATE', schema: 'public', table: 'settings',   filter: 'projekt_id=eq.' + _pid },
      { event: 'INSERT', schema: 'public', table: 'settings',   filter: 'projekt_id=eq.' + _pid },
      { event: 'UPDATE', schema: 'public', table: 'subs',       filter: 'projekt_id=eq.' + _pid },
      { event: 'INSERT', schema: 'public', table: 'subs',       filter: 'projekt_id=eq.' + _pid },
      { event: 'UPDATE', schema: 'public', table: 'vmix_calls', filter: 'projekt_id=eq.' + _pid },
      { event: 'INSERT', schema: 'public', table: 'vmix_calls', filter: 'projekt_id=eq.' + _pid }
    ],
    onMessage: function(msg) {
          if (msg.event === 'postgres_changes' && msg.payload && msg.payload.data) {
            var tbl = msg.payload.data.table;
            var rec = msg.payload.data.record;
            if (tbl === 'subs') {
              if (rec && rec.slot) {
                _subsCache[String(rec.slot)] = rec;
                if (_spxVisible && !_animating && String(rec.slot) === _currentSlot && _currentTrigger === 'in') {
                  _updateContent({ f0: rec.titel || '', f1: rec.navn || '', f2: 'SPORT', f3: 'venstre' });
                  _csPlay('el5', 0.24, 0,    'irregular', 3, 1);
                  _csPlay('el6', 0.24, 0.08, 'wipe-step', 3, 1);
                }
              }
              return;
            }
            if (tbl === 'vmix_calls') {
              if (rec && rec.slot) _vmixCache[String(rec.slot)] = rec;
              return;
            }
            if (!rec || rec.projekt_id !== _pid) return;
            if (rec.key === 'lt_slot') { _pgSlot = String(rec.value || ''); return; }
            if (rec.key === 'lt_trigger') {
              var pgS = _pgSlot || '';
              window.dispatchEvent(new MessageEvent('message', {
                data: { type: 'sbTrigger', key: 'lt_trigger', value: rec.value, slot: pgS }
              }));
            }
            return;
          }
          var p = null;
          if (msg.event === 'broadcast' && msg.payload) {
            if (msg.payload.event === 'trigger' && msg.payload.payload) p = msg.payload.payload;
          } else if (msg.event === 'trigger' && msg.payload) {
            p = msg.payload;
          }
          if (!p || p.projekt_id !== _pid || p.key !== 'lt_trigger') return;

          window.dispatchEvent(new MessageEvent('message', {
            data: { type: 'sbTrigger', key: 'lt_trigger', value: p.value, slot: p.slot || '' }
          }));
    }
  });
})();

window.addEventListener('message', function(evt) {
  if (!evt.data || evt.data.type !== 'sbTrigger' || evt.data.key !== 'lt_trigger') return;
  var v = evt.data.value; var s = String(evt.data.slot || '');
  if (_animating) return;
  if (v === 'out') {
    if (!_spxVisible) return;
    _animating = true;
    runAnimationOUT(false);
    setTimeout(function() { _currentSlot = null; _currentTrigger = null; _animating = false; setTimeout(pollTrigger, 2000); }, 2600);
  } else if (v === 'update' && s) {
    if (!_spxVisible || _currentTrigger === 'vmixcall') { _animating = false; return; }
    var sub = _subsCache[s];
    if (!sub) { _animating = false; return; }
    _animating = true;
    _currentSlot = s; _currentTrigger = 'in';
    _updateContent({ f0: sub.titel || '', f1: sub.navn || '', f2: 'SPORT', f3: 'venstre' });
    _csPlay('el5', 0.24, 0,    'irregular',  3, 1);
    _csPlay('el6', 0.24, 0.08, 'wipe-step',  3, 1);
    setTimeout(function() { _animating = false; setTimeout(pollTrigger, 2000); }, 900);
  } else if (v === 'in' && s) {
    if (_spxVisible && s === _currentSlot && _currentTrigger === 'in') return;
    var sub = _subsCache[s];
    if (!sub) { _animating = false; return; }
    _animating = true;
    var doShow = function(skipLabel) {
      _currentSlot = s; _currentTrigger = 'in';
      _updateContent({ f0: sub.titel || '', f1: sub.navn || '', f2: 'SPORT', f3: 'venstre' });
      setTimeout(function() { runAnimationIN(skipLabel); }, 50);
      setTimeout(function() { _animating = false; setTimeout(pollTrigger, 2000); }, 2700);
    };
    if (_spxVisible) { runAnimationOUT(false); setTimeout(function() { doShow(true); }, 2200); }
    else { doShow(false); }
  } else if (v === 'vmixcall' && s) {
    if (_spxVisible && s === _currentSlot && _currentTrigger === 'vmixcall') return;
    var call = _vmixCache[s];
    if (!call) { _animating = false; return; }
    _animating = true;
    var doShow = function(skipLabel) {
      _currentSlot = s; _currentTrigger = 'vmixcall';
      _updateContent({ f0: call.titel || '', f1: call.navn || '', f2: 'SPORT', f3: 'venstre' });
      setTimeout(function() { runAnimationIN(skipLabel); }, 50);
      setTimeout(function() { _animating = false; setTimeout(pollTrigger, 2000); }, 2700);
    };
    if (_spxVisible) { runAnimationOUT(false); setTimeout(function() { doShow(true); }, 2200); }
    else { doShow(false); }
  }
});
/* ── SUPABASE INTEGRATION BLOCK ── END ── */
function _updateContent(data){
  (function(){var t=clean((data&&data.f0!=null)?String(data.f0):document.getElementById('f0').innerText);var _e=document.getElementById('el6');if(!_e)return;if(_e._csT){_e._csT.forEach(clearTimeout);_e._csT=[];}gsap.set('#el6',{opacity:0,immediateRender:true});_e.innerHTML=[...t].map(function(c){var esc=c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c===' '?'&nbsp;':c;return'<span style="opacity:0">'+esc+'</span>';}).join('');})();
  (function(){var t=clean((data&&data.f1!=null)?String(data.f1):document.getElementById('f1').innerText);var _e=document.getElementById('el5');if(!_e)return;if(_e._csT){_e._csT.forEach(clearTimeout);_e._csT=[];}gsap.set('#el5',{opacity:0,immediateRender:true});_e.innerHTML=[...t].map(function(c){var esc=c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c===' '?'&nbsp;':c;return'<span style="opacity:0">'+esc+'</span>';}).join('');})();
  (function(){var t=clean((data&&data.f2!=null)?String(data.f2):document.getElementById('f2').innerText);var _e=document.getElementById('el7');if(!_e)return;if(_e._csT){_e._csT.forEach(clearTimeout);_e._csT=[];}gsap.set('#el7',{opacity:0,immediateRender:true});_e.innerHTML=[...t].map(function(c){var esc=c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c===' '?'&nbsp;':c;return'<span style="opacity:0">'+esc+'</span>';}).join('');})();
  (function(){var r=document.getElementById('el2');var s=document.getElementById('el5');if(r&&s){r.style.left=(s.offsetLeft+-38)+'px';r.style.width=Math.max(1,s.offsetWidth+337)+'px';}})();
  (function(){var v=clean((data&&data.f3!=null)?String(data.f3):document.getElementById('f3').innerText);var w=document.getElementById('lt-wrap');if(w)w.className=v&&v.toLowerCase().includes('jre')?'pos-hoejre':'pos-venstre';})();
}
function runTemplateUpdate(data){_updateContent(data);function _apply(){_prefetchAndPlay(function(){setTimeout(runAnimationIN,50);});}if(_spxVisible){runAnimationOUT();setTimeout(_apply,2093);}else{_apply();}}
window.onSpxUpdate=function(data){_updateContent(data);};
function runAnimationIN(){_spxVisible=true;
  var tl=gsap.timeline();
  tl.fromTo('#el2',{clipPath:'inset(0% 100% 0% 0%)',immediateRender:true},{clipPath:'inset(0% 0% 0% 0%)',duration:1,ease:'power2.inOut'},0);
  _csPlay('el6',0.24,0.512,'wipe-step',3,1);
  gsap.set('#el12',{opacity:1,x:0,y:0,scale:1,clipPath:'none'});
  _csPlay('el5',0.24,0.38,'irregular',3,1);
  _csPlay('el7',0.19,0.721,'wipe-step',3,1);  tl.fromTo('#grp-grp13',{clipPath:'inset(838px 0% 242px 0%)',immediateRender:true},{clipPath:'inset(0% 0% 0% 0%)',duration:0.33,ease:'power2.inOut'},0.644);

}
function runAnimationOUT(){_spxVisible=false;
  var tl=gsap.timeline();
  tl.to('#el2',{clipPath:'inset(0% 0% 100% 0%)',duration:0.99,ease:'power2.in'},1.003);
  tl.to('#el6',{opacity:0,duration:0.34,ease:'power2.in'},1.237);
  tl.to('#el5',{opacity:0,duration:0.34,ease:'power2.in'},1.381);
  tl.to('#el7',{opacity:0,duration:0.16,ease:'power2.in'},1.728);  tl.to('#grp-grp13',{clipPath:'inset(838px 0% 242px 0%)',duration:0.3,ease:'power2.in'},1.669);

}
</script>

</body>
</html>
