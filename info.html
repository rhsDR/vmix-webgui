<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Info</title>
  <link href="/fonts.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; background: transparent; overflow: hidden;
      font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; }

    /* Stak af info-bokse, forankret nederst til venstre. Vokser opad når der er flere. */
    #info-stack {
      position: fixed; left: 120px; bottom: 90px; max-width: 1600px;
      display: flex; flex-direction: column; gap: 22px;
    }

    /* Kun transform/opacity animeres (compositor-tråd) -> glat i vMix. */
    .info-box {
      background: linear-gradient(135deg, rgba(0,0,75,0.96), rgba(0,0,38,0.96));
      border-left: 8px solid #e8593c;
      border-radius: 6px;
      padding: 30px 54px 34px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      transform: translateY(40px);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(.2,.7,.2,1), opacity 0.4s ease;
      will-change: transform, opacity;
    }
    .info-box.in { transform: translateY(0); opacity: 1; }

    .info-overskrift { font-size: 86px; font-weight: 700; line-height: 1.05;
      letter-spacing: 0.5px; text-transform: uppercase; color: #fff; }
    .info-indhold { font-size: 52px; font-weight: 400; line-height: 1.3; margin-top: 14px;
      color: rgba(255,255,255,0.9); white-space: pre-line; }
    .info-overskrift:empty { display: none; }
    .info-indhold:empty   { display: none; margin-top: 0; }
  </style>
</head>
<body>
  <div id="info-stack"></div>

  <script src="js/supabase-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const projektId = params.get('p') || '';
    const outputFilter = params.get('output') || '';   // vis alle bokse med dette output (overlay-vindue)
    const boxFilter    = params.get('box') || '';       // vis kun denne ene boks (panel-preview)
    const pidFilter = projektId ? '&projekt_id=eq.' + projektId : '';
    const stack = document.getElementById('info-stack');
    let _sig = '';

    async function load() {
      try {
        const rows = await fetch(SB_URL + '/rest/v1/settings?select=value&key=eq.info_bokse' + pidFilter, { headers: SB_HEADERS }).then(r => r.json());
        let arr = [];
        try { arr = (rows && rows[0] && rows[0].value) ? JSON.parse(rows[0].value) : []; } catch {}
        if (!Array.isArray(arr)) arr = [];
        let boxes;
        if (boxFilter)         boxes = arr.filter(b => b.id === boxFilter);
        else if (outputFilter) boxes = arr.filter(b => b.output === outputFilter);
        else                   boxes = arr;               // ingen filter -> vis alt (debug/standalone)
        render(boxes);
      } catch {}
    }

    function render(boxes) {
      // Skjul tomme bokse (ingen overskrift og intet indhold) -> ingen blank kasse.
      boxes = (boxes || []).filter(b => (b.overskrift || '').trim() || (b.indhold || '').trim());
      // Undgå at genstarte animationen når intet relevant er ændret.
      const sig = JSON.stringify(boxes.map(b => [b.id, b.overskrift, b.indhold]));
      if (sig === _sig) return;
      _sig = sig;
      stack.innerHTML = '';
      boxes.forEach(b => {
        const el = document.createElement('div');
        el.className = 'info-box';
        const h = document.createElement('div'); h.className = 'info-overskrift'; h.textContent = b.overskrift || '';
        const c = document.createElement('div'); c.className = 'info-indhold';    c.textContent = b.indhold || '';
        el.appendChild(h); el.appendChild(c);
        stack.appendChild(el);
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
      });
    }

    load();
    setInterval(load, 2000);   // live-opdatering af bokse/tekst
  </script>
</body>
</html>
